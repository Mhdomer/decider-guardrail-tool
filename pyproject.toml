[project]
name = "decider-guardrail-tool"
version = "0.1.0"
description = "Sub-Second Safety Circuit Breaker Tool for Amazon Bedrock and Strands Cloud Ops Agents"
readme = "README.md"
license = { text = "MIT" }
requires-python = ">=3.10"
authors = [
    { name = "Mohamed Makhlouf", email = "muhamedomar.g@gmail.com" },
]
keywords = [
    "aws",
    "boto3",
    "botocore",
    "guardrails",
    "strands-decider-2b",
    "bedrock",
    "cloud-security",
    "ai-agents",
    "circuit-breaker",
]
dependencies = [
    "boto3>=1.35.0",
    "pydantic>=2.7.0",
    "pyyaml>=6.0",
    "rich>=13.7.0",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["decider_guardrail"]

[project.urls]
Homepage = "https://github.com/Mhdomer/decider-guardrail-tool"
Repository = "https://github.com/Mhdomer/decider-guardrail-tool"
Issues = "https://github.com/Mhdomer/decider-guardrail-tool/issues"
